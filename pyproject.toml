[project]
name = "edgar-rag"
version = "0.1.0"
description = "RAG pipeline over SEC EDGAR filings"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "voyageai>=0.5.0",
    "sentence-transformers>=3.0.0",
    "edgartools>=5.42.0",
    "rank-bm25>=0.2.2",
    "langchain-text-splitters>=0.3.0",
    "chromadb>=1.5.9",
    "python-dotenv>=1.2.2",
    "tiktoken>=0.13.0",
    "pydantic>=2.13.4",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    "tqdm>=4.68.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
